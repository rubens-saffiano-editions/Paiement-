<style>
  :root { 
    --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
    --fond: #F7F5F0;
    --texte: #111;
    --ligne: #d4cec4;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: var(--fond);
    color: var(--texte);
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    height: 100dvh; 
    overflow: hidden; 
    display: flex;
    flex-direction: column;
  }
  
  /* --- En-tête --- */
  header.entete {
    height: 52px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--fond);
    z-index: 1000;
    padding: 0 20px;
    position: relative;
  }
  
  .vague-gauche, .vague-droite {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ligne));
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .vague-gauche { margin-right: 15px; }
  .vague-droite { background: linear-gradient(90deg, var(--ligne), transparent); margin-left: 15px; }

  header.entete .marque {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--texte);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
    white-space: nowrap;
  }

  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #e3ded5;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  /* --- Animations --- */
  @keyframes expandLine { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.1s; }
  .d-2 { animation-delay: 0.2s; }
  .d-3 { animation-delay: 0.3s; }
  .d-4 { animation-delay: 0.4s; }
